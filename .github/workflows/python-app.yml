# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest
    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: npm
    - name: Install browser-test and frontend dependencies
      run: |
        npm ci
        npm --prefix frontend ci
        npx playwright install --with-deps chromium
    - name: Check, test and build the Svelte frontend
      run: |
        npm run check:frontend
        npm run test:frontend
        npm run build:frontend
    - name: Verify generated API types are current
      run: |
        PYTHON=python npm --prefix frontend run gen:api-types
        git diff --exit-code -- frontend/src/lib/api/
    - name: Verify the wheel ships the built frontend
      run: |
        python -m pip wheel . --no-deps -w dist
        python - <<'PY'
        import glob, zipfile
        names = zipfile.ZipFile(glob.glob("dist/parallax_maker-*.whl")[0]).namelist()
        assert "parallax_maker/static/app/index.html" in names, "index.html missing"
        assert any(n.startswith("parallax_maker/static/app/assets/") for n in names), "assets missing"
        print("wheel ships", sum(n.startswith("parallax_maker/static/app/") for n in names), "frontend files")
        PY
    - name: Install the built wheel into this environment
      run: |
        # --no-deps: dependencies are already installed from the editable
        # install above; this only swaps in the real (non-editable) package
        # so the console script and package data come from the wheel itself,
        # not the source checkout.
        python -m pip install --force-reinstall --no-deps dist/parallax_maker-*.whl
    - name: Smoke test the installed package
      run: |
        bash scripts/smoke_installed.sh 8119
    - name: Type-check browser tests
      run: npm run check:e2e
    - name: Test browser workflows
      run: npm run test:e2e
    - name: Upload browser-test diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-diagnostics
        path: e2e/test-results/
        if-no-files-found: ignore
