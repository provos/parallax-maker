name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # Allows manual triggering
    inputs:
      upload_to_pypi:
        description: 'Upload to PyPI (be careful!)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Build the Svelte frontend
      # The sdist and wheel ship the prebuilt app from parallax_maker/static/app.
      run: |
        npm --prefix frontend ci
        npm run build:frontend

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: python -m build

    - name: Verify the sdist and wheel ship the built frontend
      run: |
        python - <<'PY'
        import glob, tarfile, zipfile
        whl = zipfile.ZipFile(glob.glob("dist/parallax_maker-*.whl")[0]).namelist()
        assert "parallax_maker/static/app/index.html" in whl, "wheel: index.html missing"
        sdist = tarfile.open(glob.glob("dist/parallax_maker-*.tar.gz")[0]).getnames()
        assert any(n.endswith("parallax_maker/static/app/index.html") for n in sdist), "sdist: index.html missing"
        print("ok")
        PY
    
    - name: Check distribution
      run: twine check dist/*
    
    - name: Upload to PyPI
      if: (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'workflow_dispatch' && inputs.upload_to_pypi == true)
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
